[importlinter]
root_package = __PROJECT__
include_external_packages = True

[importlinter:contract:clean-architecture-layers]
name = Clean Architecture Layer Dependencies
type = layers
layers =
    __PROJECT__.l4_frameworks_and_drivers
    __PROJECT__.l3_interface_adapters
    __PROJECT__.l2_use_cases
    __PROJECT__.l1_entities

[importlinter:contract:gateways-isolation]
name = Gateways should not depend on controllers or presenters
type = forbidden
source_modules =
    __PROJECT__.l3_interface_adapters.gateways
forbidden_modules =
    __PROJECT__.l3_interface_adapters.controllers
    __PROJECT__.l3_interface_adapters.presenters

[importlinter:contract:presenters-isolation]
name = Presenters should not depend on controllers or gateways
type = forbidden
source_modules =
    __PROJECT__.l3_interface_adapters.presenters
forbidden_modules =
    __PROJECT__.l3_interface_adapters.controllers
    __PROJECT__.l3_interface_adapters.gateways

[importlinter:contract:controllers-isolation]
name = Controllers should not depend on gateways or presenters
type = forbidden
source_modules =
    __PROJECT__.l3_interface_adapters.controllers
forbidden_modules =
    __PROJECT__.l3_interface_adapters.gateways
    __PROJECT__.l3_interface_adapters.presenters

[importlinter:contract:no-external-frameworks-in-core]
name = Prevent external frameworks in core business logic (L1/L2)
type = forbidden
source_modules =
    __PROJECT__.l1_entities
    __PROJECT__.l2_use_cases
forbidden_modules =
    requests
    httpx
    sqlalchemy
    django
    fastapi
    flask
    celery
    boto3
    botocore
